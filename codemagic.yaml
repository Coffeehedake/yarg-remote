# Codemagic CI/CD for YARG Remote - iOS (TestFlight) and Android (signed APK).
#
# STATUS: WRITTEN BUT NEVER RUN. Nothing here has been executed by Codemagic. The shape is copied
# from two builds that DO work: adhd-nagger (iOS, personal Apple account - the closest model for
# this project, which is also personal) and shopstack-mobile (the Android release APK). Expect to
# iterate on a first failure; read docs/MOBILE-BUILD.md for what has to exist before a build can
# succeed (Apple app record, a Codemagic app + variable group, a webhook, an Android keystore).
#
# ios/ and android/ are NOT committed (.gitignore): they are regenerated by `cap add` on every
# build, and scripts/native_setup.py re-applies the native edits the app cannot work without (a
# cleartext exception for the game's plain-HTTP console, the iOS local-network prompt text, and
# the encryption-compliance flag). That script fails loudly if the generated project is not the
# shape it expects.
#
# TRIGGERING. This repo is on the generic git provider, so Codemagic is NOT watching it: the
# repository has to tell it, through a GitLab webhook to api.codemagic.io/hooks/<app id> (adhd-nagger's
# is project hook 51). Until that hook exists, `triggering:` below does nothing and a build starts only
# through the API:
#   POST https://codemagic.io/api/v3/apps/<app id>/builds   {"workflow_id":"ios-testflight","branch":"main"}
# with the `x-auth-token` header (1Password `CodeMagic API Token`). Once it exists, a push to main
# spends build minutes on BOTH workflows unless the changeset filter skips it.
#
# SIGNING lives in the encrypted variable group `yargremote_signing`, created through the Codemagic
# API from 1Password values and never printed. A push-triggered build cannot be handed secrets at
# request time, which is why they are stored in Codemagic:
#   iOS     APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY,
#           CERTIFICATE_PRIVATE_KEY  (the personal team's existing key, reused on purpose: a second
#           one would mint a second Apple Distribution certificate against the two-certificate limit)
#   Android ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS  (a NEW keystore;
#           back it up - losing it means phones cannot upgrade in place)
workflows:
  ios-testflight:
    name: YARG Remote iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      # Only a change to the app can change what gets built, so a docs-only push must not ship a
      # TestFlight build. A "skipped" build still starts and stops at "Fetching app sources", so
      # skipped runs appear in the build list (adhd-nagger measured this). codemagic.yaml itself is
      # always in the changeset. The FIRST build after adding this runs regardless.
      changeset:
        includes:
          - 'src/'
          - 'scripts/'
          - 'index.html'
          - 'package.json'
          - 'package-lock.json'
          - 'capacitor.config.ts'
          - 'vite.config.ts'
          - 'tsconfig.json'
          - 'assets/'
    environment:
      groups:
        - yargremote_signing
      vars:
        BUNDLE_ID: "com.badassium.yargremote"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Test the native-setup script
        script: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Run the app's tests
        script: npm test

      - name: Build web bundle (tsc + Vite -> dist)
        script: npm run build

      - name: Generate iOS platform (Capacitor) + sync the bundled web app
        script: |
          if [ ! -d "ios" ]; then npx cap add ios --packagemanager Cocoapods; fi
          npx cap sync ios

      - name: Generate the app icon (only if an icon source exists)
        # There is NO assets/ folder yet, so today this is skipped and the build ships Capacitor's
        # placeholder icon. A real icon needs assets/icon-only.png: 1024x1024, RGB, NO alpha (Apple
        # rejects transparency). Do not use the upstream YARG logo - it is YARC's mark.
        script: |
          if [ -f assets/icon-only.png ]; then npx @capacitor/assets generate --ios; else echo "no assets/icon-only.png - keeping the placeholder icon"; fi

      - name: Install CocoaPods (produces App.xcworkspace and links the native plugins)
        script: |
          cd ios/App
          pod install --repo-update
          ls -la *.xcworkspace

      - name: Native configuration (local-network exception, usage text, encryption flag)
        # MANDATORY. Without it every request to the console is refused by iOS.
        script: python3 scripts/native_setup.py ios --ios-dir ios

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch (and create) signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Set build number
        # Epoch seconds: monotonic, and survives the Codemagic app's own counter being reset.
        script: |
          cd ios/App && agvtool new-version -all "$(date +%s)"

      - name: Build IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"

      - name: Upload to App Store Connect (TestFlight)
        # Internal testers get every build on upload alone. A green step is NOT proof Apple has the
        # build (adhd-nagger's rule): verify from App Store Connect, and allow ~5 minutes for Apple
        # to list it after upload.
        script: app-store-connect publish --path "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jason@badassium.com
        notify:
          success: true
          failure: true

  android:
    name: YARG Remote Android - APK
    # ShopStack's android workflow runs on a Mac; nothing here needs one, and Linux is the
    # ordinary (and cheaper) choice. Unverified until it runs.
    instance_type: linux_x2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'src/'
          - 'scripts/'
          - 'index.html'
          - 'package.json'
          - 'package-lock.json'
          - 'capacitor.config.ts'
          - 'vite.config.ts'
          - 'tsconfig.json'
          - 'assets/'
    environment:
      groups:
        - yargremote_signing
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Test the native-setup script
        script: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Run the app's tests
        script: npm test
      - name: Build web bundle (tsc + Vite -> dist)
        script: npm run build
      - name: Generate Android platform (Capacitor) + sync the bundled web app
        script: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Generate the app icon (only if an icon source exists)
        script: |
          if [ -f assets/icon-only.png ]; then npx @capacitor/assets generate --android; else echo "no assets/icon-only.png - keeping the placeholder icon"; fi
      - name: Native configuration (cleartext HTTP to the game's console)
        # MANDATORY. Android 9+ refuses cleartext by default, so without it the app cannot reach the console.
        script: python3 scripts/native_setup.py android --android-dir android
      - name: Build signed release APK (stable key, so phones can upgrade in place)
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/yargremote.jks
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/yargremote.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - jason@badassium.com
        notify:
          success: true
          failure: true
